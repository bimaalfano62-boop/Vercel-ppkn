<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tes Kepribadian Pancasila</title>
<meta name="description" content="Cari tahu kamu paling condong ke sila yang mana.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇮🇩</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
@property --h{syntax:'<number>';inherits:true;initial-value:262}
:root{--h:262;--bg:#f6f5fb;--card:#fff;--ink:#1d1b3a;--mu:#6b6987;--ln:#e3e1f0;--ac:#8b5cf6;--hero:#8b5cf6;--hi:#fff;transition:--h 1s}
@media(prefers-color-scheme:dark){:root{--bg:#14132a;--card:#241f3d;--ink:#f1f0fb;--mu:#a3a1c4;--ln:#3a3560;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.6 Figtree,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:linear-gradient(160deg,hsl(var(--h) 100% 96%),hsl(calc(var(--h) + 50) 100% 90%));background-attachment:fixed}
@media(prefers-color-scheme:dark){body{background:linear-gradient(160deg,hsl(var(--h) 45% 12%),hsl(calc(var(--h) + 50) 45% 18%));background-attachment:fixed}}
.bg{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(50px);opacity:.55;background:hsl(calc(var(--h) + var(--o)) 95% 65%);width:var(--s);height:var(--s);left:var(--x);top:var(--y);animation:fl var(--d) ease-in-out infinite alternate;transition:translate .4s ease-out}
@media(prefers-color-scheme:dark){.blob{opacity:.35}}
@keyframes fl{to{transform:translate(40px,-50px) scale(1.15)}}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;line-height:1.1;margin:0}
.w{max-width:680px;margin:0 auto;padding:0 18px}
.bar0{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;z-index:5;font:800 18px "Bricolage Grotesque",sans-serif}
.mus{font:600 14px Figtree,sans-serif;background:var(--card);color:var(--ink);border:2px solid var(--ln);border-radius:999px;padding:7px 14px;cursor:pointer}
.mus:focus-visible,.ghost:focus-visible,.op:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.pad{height:62px}
.hero{padding:20px 0 8px}
.hero h1{font-size:clamp(38px,9vw,60px);font-weight:800;letter-spacing:-1px}
.hero p{color:var(--mu);max-width:46ch}
.row5{display:flex;gap:4px;margin:20px 0 4px;flex-wrap:wrap}
.row5 svg{width:19%;min-width:56px;height:auto;animation:bob 2.4s ease-in-out infinite}
.row5 svg:nth-child(2){animation-delay:.3s}.row5 svg:nth-child(3){animation-delay:.6s}.row5 svg:nth-child(4){animation-delay:.9s}.row5 svg:nth-child(5){animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
.card{background:var(--card);border:2px solid var(--ln);border-radius:24px;padding:22px;margin:18px 0}
label{display:block;font-weight:600;margin:12px 0 6px}
input{width:100%;font:inherit;padding:14px;border-radius:14px;border:2px solid var(--ln);background:var(--bg);color:var(--ink)}
input:focus{outline:3px solid var(--ac);outline-offset:1px;border-color:transparent}
.btn{font:700 17px "Bricolage Grotesque",sans-serif;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:15px 30px;margin-top:20px;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
.err{color:#e63946;font-size:15px;min-height:22px;margin-top:8px}
.ghost{background:none;border:0;color:var(--mu);font:600 15px Figtree,sans-serif;cursor:pointer;padding:8px 0}
.meter{display:flex;align-items:center;gap:12px;padding-top:6px}
.pt{flex:1;height:12px;border-radius:9px;background:rgba(127,127,160,.25);overflow:hidden}.pt i{display:block;height:100%;background:linear-gradient(90deg,#ff6b6b,#ffb02e,#2ec4b6,#4cc9f0,#9b5de5);background-size:680px 100%;border-radius:9px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.meter span{font:800 15px "Bricolage Grotesque",sans-serif;min-width:48px;text-align:right}
.stage{animation:in .45s cubic-bezier(.2,.9,.3,1)}
@keyframes in{from{opacity:0;transform:translateX(40px)}}
.qc{position:relative;background:var(--card);border:2px solid var(--ln);border-radius:28px;padding:64px 22px 26px;margin:70px 0 22px;text-align:center;box-shadow:0 10px 0 -2px hsl(var(--h) 70% 70% / .35)}
.qc .mw{position:absolute;left:50%;top:-62px;translate:-50% 0;animation:bob 2s ease-in-out infinite}
.qt{font:700 clamp(21px,5.4vw,28px)/1.3 "Bricolage Grotesque",sans-serif;margin:0}
.ops{display:grid;gap:10px}
.op{--c:#999;position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:600 17px Figtree,sans-serif;color:var(--ink);background:var(--card);border:2px solid var(--ln);border-radius:20px;padding:12px 16px;cursor:pointer;opacity:0;animation:pop .4s cubic-bezier(.2,1.3,.4,1) forwards;animation-delay:calc(var(--i) * 60ms + 150ms);transition:transform .15s,box-shadow .15s,background .2s,color .2s,border-color .2s;--mx:50%}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1}}
.op::before{content:"";position:absolute;inset:0;background:radial-gradient(180px circle at var(--mx) 50%,color-mix(in srgb,var(--c) 22%,transparent),transparent);opacity:0;transition:opacity .2s}
.op:hover{transform:translateY(-3px) rotate(-.4deg);border-color:var(--c);box-shadow:0 8px 0 -2px color-mix(in srgb,var(--c) 45%,transparent)}.op:hover::before{opacity:1}
.op i{position:relative;flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:#fff;font:800 20px "Bricolage Grotesque",sans-serif;font-style:normal;transition:transform .25s}
.op:hover i{transform:rotate(-8deg) scale(1.1)}
.op span{position:relative;flex:1}.op em{position:relative;font-style:normal;font-size:26px}
.op.on{background:var(--c);border-color:var(--c);color:#fff;transform:scale(1.03);box-shadow:0 8px 0 -2px color-mix(in srgb,var(--c) 55%,#000)}
.op.on i{background:#fff;color:var(--c)}
.op.dim{opacity:.45!important}
.hint{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 40px}
.mu{color:var(--mu);font-size:15px}
.load{text-align:center;font:800 26px "Bricolage Grotesque",sans-serif;padding:30vh 0}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
.res{background:var(--hero);color:var(--hi);text-align:center;padding:78px 18px 44px;border-radius:0 0 40px 40px;animation:in .6s ease-out}
@media(prefers-reduced-motion:reduce){*,.stage,.res,.op{animation:none!important;transition:none!important}.op{opacity:1}}
.res .who{opacity:.85;font-weight:600}
.res h1{font-size:clamp(34px,9vw,54px);font-weight:800;margin:6px 0}
.kode{display:inline-block;font:800 20px "Bricolage Grotesque",sans-serif;border:3px solid currentColor;border-radius:999px;padding:4px 18px;margin:8px 0 0}
.bar{margin:14px 0}.bl{display:flex;justify-content:space-between;font-size:15px}
.tr{height:16px;background:var(--ln);border-radius:9px;overflow:hidden;margin-top:4px}.tr i{display:block;height:100%;border-radius:9px}
.sec h2{font-size:24px;margin:0 0 8px}.sec p{margin:0 0 10px}
/* Tombol data pojok kanan bawah + panel data (admin) */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--bg);border:0;cursor:pointer;font-size:24px;line-height:1;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.28);transition:transform .2s}
.fab:hover{transform:scale(1.1) rotate(-8deg)}
.fab:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
.ov{position:fixed;inset:0;z-index:30;background:rgba(16,12,44,.55);backdrop-filter:blur(4px);display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 12px calc(18px + env(safe-area-inset-bottom))}
.ov.on{display:block}
.panel{max-width:920px;margin:0 auto;background:var(--bg);border:2px solid var(--ln);border-radius:24px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.pbar h2{font-size:22px}
.pclose{flex:none;width:40px;height:40px;border-radius:50%;background:var(--card);border:2px solid var(--ln);color:var(--ink);font:800 16px Figtree,sans-serif;cursor:pointer}
.pclose:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#adm .card{margin:0 0 14px;border-radius:18px;padding:16px}
#adm input,#adm select,#adm button{font:inherit;padding:10px 14px;border-radius:12px;border:2px solid var(--ln);background:var(--bg);color:var(--ink)}
#adm button{cursor:pointer;font-weight:600}#adm .p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#adm table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}#adm th,#adm td{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:left}
#adm .sc{overflow-x:auto}#adm .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#adm .st{flex:1;min-width:120px}#adm .st b{font-size:26px;display:block}#adm .mu{color:var(--mu)}#adm h2{margin:0 0 10px;font-size:18px}
@media(max-width:520px){.ov{padding:10px 6px calc(10px + env(safe-area-inset-bottom))}.panel{padding:14px;border-radius:18px}}
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true">
 <div class="blob" style="--s:420px;--x:-8%;--y:-6%;--o:0;--d:9s"></div>
 <div class="blob" style="--s:340px;--x:62%;--y:12%;--o:60;--d:11s"></div>
 <div class="blob" style="--s:380px;--x:20%;--y:66%;--o:-50;--d:13s"></div>
</div>
<canvas id="cf" aria-hidden="true"></canvas>
<div class="bar0"><span>🇮🇩 Tes Pancasila</span><button class="mus" id="mus" aria-label="Nyalakan atau matikan musik">🔇 Musik mati</button></div>
<main id="app"></main>
<button class="fab" id="fab" title="Lihat data kuisioner" aria-label="Lihat data kuisioner (admin)">📊</button>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Data kuisioner">
 <div class="panel">
  <div class="pbar"><h2>📊 Data Kuisioner</h2><button class="pclose" id="pclose" aria-label="Tutup panel data">✕</button></div>
  <div id="adm"></div>
 </div>
</div>
<script src="sila.js"></script>
<script src="bank.js"></script>
<script>
// ===== Pengaturan musik =====
// Kosongkan MUSIC_URL untuk memakai musik ceria bawaan (dibuat langsung di browser).
// Atau isi dengan file mp3 milikmu, mis. "/musik.mp3" (pastikan kamu punya hak/lisensinya).
const MUSIC_URL="";
const Music=(()=>{let ctx,master,timer,step=0,next=0,on=false,au=null;
 const CH=[[261.63,329.63,392],[196,246.94,392],[220,261.63,329.63],[174.61,220,261.63]],PE=[523.25,587.33,659.25,783.99,880];
 function tone(f,t,d,type,g){const o=ctx.createOscillator(),v=ctx.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(master);o.start(t);o.stop(t+d+.05)}
 function shk(t){const b=ctx.createBuffer(1,2205,44100),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const n=ctx.createBufferSource(),f=ctx.createBiquadFilter(),v=ctx.createGain();n.buffer=b;f.type="highpass";f.frequency.value=6000;v.gain.value=.05;n.connect(f);f.connect(v);v.connect(master);n.start(t)}
 function sched(){while(next<ctx.currentTime+.3){const s=step%32,ch=CH[Math.floor(s/8)%4],e=s%8;
  if([0,3,4,6].includes(e))ch.forEach((f,i)=>tone(f,next+i*.012,.55,"triangle",.09));
  if(e%4===0)tone(ch[0]/2,next,.4,"sine",.16);
  if(e%2===1)shk(next);
  if(e%2===0&&Math.random()<.5)tone(PE[Math.floor(Math.random()*5)],next,.5,"sine",.06);
  next+=.268;step++}}
 function btn(){mus.textContent=on?"🔊 Musik nyala":"🔇 Musik mati"}
 return{get on(){return on},
  start(){if(on)return;on=true;btn();
   if(MUSIC_URL){au=au||Object.assign(new Audio(MUSIC_URL),{loop:true,volume:.4});au.play().catch(()=>{});return}
   ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();
   if(!master){master=ctx.createGain();master.connect(ctx.destination)}
   master.gain.setTargetAtTime(.8,ctx.currentTime,.3);next=ctx.currentTime+.1;timer=setInterval(sched,100)},
  stop(){if(!on)return;on=false;btn();if(au)au.pause();else{clearInterval(timer);master.gain.setTargetAtTime(0,ctx.currentTime,.1)}},
  toggle(){on?this.stop():this.start()}}})();
mus.onclick=()=>Music.toggle();

// ===== Efek: latar interaktif & confetti =====
const blobs=[...document.querySelectorAll(".blob")];
addEventListener("pointermove",e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;blobs.forEach((b,i)=>b.style.translate=`${x*(40+i*30)}px ${y*(40+i*30)}px`)});
const cf=document.getElementById("cf"),cx=cf.getContext("2d");let ps=[],raf=0;
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
function fit(){cf.width=innerWidth;cf.height=innerHeight}fit();addEventListener("resize",fit);
function burst(x,y,col){if(RM)return;const C=[col,"#ffb02e","#ff6b6b","#2ec4b6","#9b5de5","#fff"];
 for(let i=0;i<34;i++){const a=Math.random()*Math.PI*2,v=3+Math.random()*7;ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,r:3+Math.random()*4,c:C[i%C.length],l:1,rot:Math.random()*6})}
 if(!raf)raf=requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,cf.width,cf.height);ps=ps.filter(p=>p.l>0);
 ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.98;p.l-=.02;p.rot+=.2;cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
 raf=ps.length?requestAnimationFrame(tick):0}

// ===== Tes =====
const app=document.getElementById("app");
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
// 5 pernyataan acak dari tiap sila (bank 25) = 25 soal, lalu diacak urutannya
const pick=()=>shuf(BANK.flatMap((_,i)=>shuf([...Array(25).keys()]).slice(0,5).map(k=>i*25+k)));
let order=pick(),ans={},pg=0,lock=false,me={nama:"",kelas:""};
const N=order.length,txt=id=>BANK[Math.floor(id/25)][id%25],HUE=[45,355,215,262,150];
const setH=h=>document.documentElement.style.setProperty("--h",h);

function intro(err=""){setH(262);
 app.innerHTML=`<div class="w stage"><div class="pad"></div>
 <div class="hero"><h1>Kamu condong ke sila yang mana?</h1>
 <p>25 pernyataan singkat yang diacak untukmu, dijawab satu per satu. Pilih A sampai E. Tidak ada jawaban benar atau salah, jadi jawab sesuai dirimu yang sebenarnya.</p>
 <div class="row5">${SILA.map((_,i)=>mascot(i)).join("")}</div></div>
 <div class="card"><label for="nm">Nama lengkap</label><input id="nm" autocomplete="name" value="${esc(me.nama)}" placeholder="Contoh: Budi Santoso">
 <label for="kl">Kelas</label><input id="kl" value="${esc(me.kelas)}" placeholder="Contoh: XI IPA 2">
 <div class="err" id="er" role="alert">${err}</div><button class="btn" id="go">Mulai tes 🎵</button>
 <p class="mu" style="margin:12px 0 0">Musik akan menyala saat tes dimulai. Matikan kapan saja di pojok kanan atas.</p></div></div>`;
 document.getElementById("go").onclick=()=>{const n=nm.value.trim(),k=kl.value.trim();
  if(n.length<2||!k)return intro("Isi nama dan kelas dulu sebelum mulai.");
  me={nama:n,kelas:k};pg=0;ans={};Music.start();quiz()};
}
const OP=[["A","Sangat sesuai denganku","😍","#ff6b6b"],["B","Sesuai denganku","🙂","#ffa31a"],["C","Netral, kadang-kadang","😐","#1fb5a5"],["D","Kurang sesuai denganku","🤔","#3aa8e8"],["E","Tidak sesuai denganku","🙅","#9b5de5"]];
function quiz(){lock=false;
 const id=order[pg];setH((250+pg*17)%360);
 app.innerHTML=`<div class="w stage"><div class="pad"></div>
 <div class="meter"><div class="pt"><i style="width:${(pg+1)/N*100}%"></i></div><span>${pg+1} / ${N}</span></div>
 <div class="qc"><div class="mw">${mascot(Math.floor(id/25),96)}</div><p class="qt">${esc(txt(id))}</p></div>
 <div class="ops" role="radiogroup" aria-label="Pilih satu jawaban">${OP.map(([l,t,e,c],i)=>`<button class="op ${ans[id]===5-i?"on":""}" role="radio" aria-checked="${ans[id]===5-i}" data-v="${5-i}" style="--c:${c};--i:${i}"><i>${l}</i><span>${t}</span><em>${e}</em></button>`).join("")}</div>
 <div class="hint">${pg>0?'<button class="ghost" id="bk">← Sebelumnya</button>':'<span></span>'}<span class="mu">Bisa juga tekan A–E di keyboard</span></div></div>`;
 app.querySelectorAll(".op").forEach(b=>{b.onpointermove=e=>b.style.setProperty("--mx",e.offsetX+"px");b.onclick=e=>choose(+b.dataset.v,b,e)});
 const bk=document.getElementById("bk");if(bk)bk.onclick=()=>{pg--;quiz()};
}
function choose(v,b,e){if(lock)return;lock=true;const id=order[pg];ans[id]=v;
 app.querySelectorAll(".op").forEach(x=>x.classList.toggle("dim",x!==b));b.classList.add("on");
 const r=b.getBoundingClientRect();burst(e&&e.clientX?e.clientX:r.left+r.width/2,e&&e.clientY?e.clientY:r.top+r.height/2,getComputedStyle(b).getPropertyValue("--c"));
 setTimeout(()=>{pg<N-1?(pg++,quiz()):finish()},560)}
addEventListener("keydown",e=>{if(ov.classList.contains("on"))return;const o=app.querySelectorAll(".op");if(!o.length||lock)return;
 const i="abcde".indexOf(e.key.toLowerCase());if(i>=0&&e.key.length===1)o[i].click();
 else if((e.key==="ArrowLeft"||e.key==="Backspace")&&pg>0&&document.activeElement.tagName!=="INPUT"){pg--;quiz()}});
const LV=v=>v>=70?"Tinggi":v>=40?"Sedang":"Rendah";
async function finish(){
 const jawab=order.map(id=>[id,ans[id]]),sum=[0,0,0,0,0];
 jawab.forEach(([id,v])=>sum[Math.floor(id/25)]+=v-1);
 const skor=sum.map(v=>Math.round(v/20*100)),mx=Math.max(...skor),d=skor.map((v,i)=>v===mx?i:-1).filter(i=>i>=0);
 app.innerHTML='<div class="load">Menghitung hasilmu… 🎶</div>';
 let saved=true;
 try{const r=await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...me,jawab})});saved=r.ok}catch(e){saved=false}
 show(skor,d,saved);
}
function show(skor,d,saved){
 const T=tipe(d,skor),P=SILA[T.p],S=SILA[T.s];
 setH(HUE[T.p]);document.documentElement.style.setProperty("--hero",P.c);document.documentElement.style.setProperty("--hi",P.ink);
 // alasan: pernyataan sila dominan yang paling kamu setujui
 const top=order.filter(id=>Math.floor(id/25)===T.p).sort((a,b)=>ans[b]-ans[a]).slice(0,2);
 const rank=skor.map((v,i)=>i).sort((a,b)=>skor[b]-skor[a]);
 app.innerHTML=`<div class="res"><div class="who">${esc(me.nama)} · ${esc(me.kelas)}</div>${mascot(T.p,170)}<div class="who">Kamu adalah</div><h1>${esc(T.nama)}</h1><span class="kode">${T.kode}</span></div>
 <div class="w"><div class="card sec"><h2>Skor kelima silamu</h2>${bars(skor)}</div>
 <div class="card sec"><h2>Kenapa kamu dapat ${P.n}?</h2><p class="mu">${esc(P.t)}</p><p>${esc(P.d)}</p>
 <p>Skormu di sila ini <b>${skor[T.p]}%</b>${d.length>1?" (sama tinggi dengan "+d.filter(x=>x!==T.p).map(x=>SILA[x].n).join(", ")+")":""}. Kamu paling setuju dengan:</p>
 <ul>${top.map(id=>`<li>“${esc(txt(id))}”</li>`).join("")}</ul>
 <p><b>Kekuatan:</b> ${esc(P.kuat)}</p><p><b>Tantangan:</b> ${esc(P.tantang)}</p>
 <p><b>Sisi keduamu:</b> ${S.n} (${skor[T.s]}%). ${esc(S.d)}</p></div>
 <h2 style="margin:26px 0 0;font-size:26px">Rincian tiap sila</h2>
 ${rank.map(i=>`<div class="card sec"><div style="display:flex;gap:14px;align-items:center">${mascot(i,84)}<div><h3 style="font-size:21px">${SILA[i].arch}</h3><div class="mu">${SILA[i].n} · ${skor[i]}% · ${LV(skor[i])}</div></div></div>
 <p style="margin-top:12px"><b>Maknanya:</b> ${esc(SILA[i].makna)}</p>
 <p><b>Alasan:</b> ${esc(skor[i]>=70?SILA[i].hi:skor[i]>=40?SILA[i].mid:SILA[i].lo)}</p>
 <p style="margin-bottom:4px"><b>Saran:</b></p><ul style="margin:0 0 4px;padding-left:20px">${SILA[i].sr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}
 <p class="mu" style="text-align:center">${saved?"Hasilmu sudah terkirim ke guru.":"Hasil belum tersimpan di server. Coba ulangi tes nanti."}</p>
 <div style="text-align:center;padding-bottom:50px"><button class="btn" id="re">Ulangi tes</button></div></div>`;
 scrollTo(0,0);if(!RM)burst(innerWidth/2,innerHeight/3,P.c);
 re.onclick=()=>{document.documentElement.style.removeProperty("--hero");document.documentElement.style.removeProperty("--hi");me={nama:"",kelas:""};order=pick();ans={};intro()};
}
intro();

// ===== Panel data kuisioner (tombol pojok kanan bawah, khusus guru) =====
const fab=document.getElementById("fab"),ov=document.getElementById("ov"),adm=document.getElementById("adm");
let apw=sessionStorage.getItem("pw")||"",arows=[],aflt="",aq="",aopen="";
async function aapi(m="GET",q=""){
 let r;try{r=await fetch("/api/admin"+q,{method:m,headers:{"x-admin-password":apw}})}catch(e){throw new Error("Tidak bisa terhubung ke server. Buka lewat alamat Vercel-mu, bukan dari file di komputer.")}
 let j=null;try{j=await r.json()}catch(e){}
 if(!r.ok)throw new Error((j&&j.error)||(r.status===404?"Server belum aktif (API tidak ditemukan). Pastikan folder api/ ikut ter-deploy.":"Gagal ("+r.status+")"));
 return j}
function alogin(e=""){
 adm.innerHTML=`<div class="card" style="max-width:380px;margin:6vh auto"><h2>Masuk admin</h2><form id="a-lf" autocomplete="on">
 <label for="a-pw" class="mu">Password admin</label>
 <input id="a-pw" name="password" type="password" autocomplete="current-password" placeholder="Ketik password admin" style="width:100%;margin-top:6px" required>
 <label class="mu" style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="checkbox" id="a-sh" style="width:auto"> Tampilkan password</label>
 <p style="color:#e63946;min-height:22px;margin:0 0 10px" role="alert" id="a-er">${esc(e)}</p>
 <button class="p" id="a-sb" type="submit">Masuk</button></form>
 <p class="mu" style="font-size:13px;margin:14px 0 0">Password ini sama dengan variabel <b>ADMIN_PASSWORD</b> yang kamu atur di Vercel.</p></div>`;
 const f=document.getElementById("a-lf"),i=document.getElementById("a-pw"),sb=document.getElementById("a-sb");
 i.focus();
 document.getElementById("a-sh").onchange=ev=>{i.type=ev.target.checked?"text":"password"};
 f.onsubmit=async ev=>{ev.preventDefault();apw=i.value;sb.disabled=true;sb.textContent="Memeriksa…";
  try{arows=(await aapi()).rows;sessionStorage.setItem("pw",apw);adash()}catch(x){apw="";alogin(x.message)}};
}
function adash(){
 const ks=[...new Set(arows.map(r=>r.kelas))].sort(),R=arows.filter(r=>(!aflt||r.kelas===aflt)&&r.nama.toLowerCase().includes(aq.toLowerCase()));
 const KL=ks.map(k=>{const g=arows.filter(r=>r.kelas===k);return `<tr><td>${esc(k)}</td><td>${g.length}</td>${[0,1,2,3,4].map(i=>`<td>${Math.round(g.reduce((a,r)=>a+r.skor[i],0)/g.length)}</td>`).join("")}</tr>`}).join("");
 const avg=[0,1,2,3,4].map(i=>R.length?Math.round(R.reduce((a,r)=>a+r.skor[i],0)/R.length):0);
 const cnt=[0,0,0,0,0];R.forEach(r=>r.dominan.forEach(i=>cnt[i]++));const top=R.length?cnt.indexOf(Math.max(...cnt)):-1;
 const cb=cnt.map(v=>R.length?Math.round(v/R.length*100):0);
 adm.innerHTML=`<div class="row" style="justify-content:space-between;margin:0 0 14px"><span class="mu">${R.length} responden ditampilkan</span><button id="a-out">Keluar</button></div>
 <div class="card row"><input id="a-s" placeholder="Cari nama peserta" value="${esc(aq)}" aria-label="Cari nama"><select id="a-f" aria-label="Filter kelas"><option value="">Semua kelas</option>${ks.map(k=>`<option ${k===aflt?"selected":""}>${esc(k)}</option>`).join("")}</select><button id="a-rf">Muat ulang</button><button class="p" id="a-csv">Unduh CSV</button></div>
 <div class="card row"><div class="st"><b>${R.length}</b>Responden</div><div class="st"><b>${top>=0?SILA[top].n:"-"}</b>Paling dominan</div></div>
 <div class="card"><h2>Rata-rata skor per sila</h2>${bars(avg)}</div>
 <div class="card"><h2>Persentase responden per sila dominan</h2>${bars(cb)}</div>
 <div class="card sc"><h2>Ringkasan per kelas (rata-rata skor)</h2><table style="min-width:0"><tr><th>Kelas</th><th>Peserta</th><th>S1</th><th>S2</th><th>S3</th><th>S4</th><th>S5</th></tr>${KL||'<tr><td colspan="7" class="mu">Belum ada data.</td></tr>'}</table></div>
 <div class="card sc"><h2>Data peserta (klik baris untuk detail)</h2><table><tr><th>Nama</th><th>Kelas</th><th>Tipe</th><th>S1</th><th>S2</th><th>S3</th><th>S4</th><th>S5</th><th>Waktu</th><th></th></tr>
 ${R.map(r=>`<tr data-r="${r.id}" style="cursor:pointer"><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td>${tipe(r.dominan,r.skor).kode}</td>${r.skor.map(x=>`<td>${x}</td>`).join("")}<td>${new Date(r.waktu).toLocaleString("id-ID",{dateStyle:"short",timeStyle:"short"})}</td><td><button data-d="${r.id}" aria-label="Hapus ${esc(r.nama)}">Hapus</button></td></tr>${aopen===r.id?`<tr><td colspan="10"><b>${esc(tipe(r.dominan,r.skor).nama)}</b> (${tipe(r.dominan,r.skor).kode})<br>Sila dominan: ${r.dominan.map(i=>SILA[i].n+" – "+SILA[i].t).join("; ")}<br>Urutan skor: ${r.skor.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).map(([v,i])=>SILA[i].n+" "+v+"%").join(" > ")}<br>Diisi: ${new Date(r.waktu).toLocaleString("id-ID",{dateStyle:"full",timeStyle:"short"})}</td></tr>`:""}`).join("")||'<tr><td colspan="10" class="mu">Belum ada data.</td></tr>'}</table></div>`;
 const f=document.getElementById("a-f"),s=document.getElementById("a-s"),out=document.getElementById("a-out"),rf=document.getElementById("a-rf"),csv=document.getElementById("a-csv");
 f.onchange=()=>{aflt=f.value;adash()};
 s.oninput=()=>{aq=s.value;adash();const e=document.getElementById("a-s");e.focus();e.setSelectionRange(aq.length,aq.length)};
 adm.querySelectorAll("[data-r]").forEach(t=>t.onclick=e=>{if(e.target.closest("button"))return;aopen=aopen===t.dataset.r?"":t.dataset.r;adash()});
 out.onclick=()=>{sessionStorage.removeItem("pw");apw="";alogin()};
 rf.onclick=async()=>{try{arows=(await aapi()).rows;adash()}catch(x){apw="";alogin(x.message)}};
 csv.onclick=()=>{const c=["Nama,Kelas,Tipe,Nama Tipe,S1,S2,S3,S4,S5,Waktu",...R.map(r=>{const t=tipe(r.dominan,r.skor);return[r.nama,r.kelas,t.kode,t.nama,...r.skor,new Date(r.waktu).toLocaleString("id-ID")].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")})].join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+c],{type:"text/csv"}));a.download="hasil-tes-pancasila.csv";a.click()};
 adm.querySelectorAll("[data-d]").forEach(x=>x.onclick=async()=>{if(confirm("Hapus data ini?")){try{await aapi("DELETE","?id="+x.dataset.d)}catch(e){}arows=arows.filter(r=>r.id!==x.dataset.d);adash()}});
}
function openPanel(){ov.classList.add("on");document.body.style.overflow="hidden";
 if(apw){aapi().then(d=>{arows=d.rows;adash()}).catch(x=>{apw="";alogin(x.message)})}
 else alogin()}
function closePanel(){ov.classList.remove("on");document.body.style.overflow=""}
fab.onclick=openPanel;
document.getElementById("pclose").onclick=closePanel;
ov.onclick=e=>{if(e.target===ov)closePanel()};
addEventListener("keydown",e=>{if(e.key==="Escape"&&ov.classList.contains("on"))closePanel()});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Admin · Tes Pancasila</title>
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#1d1b3a;--mu:#6b6987;--ln:#e3e1f0}
@media(prefers-color-scheme:dark){:root{--bg:#14132a;--card:#1f1e3a;--ink:#f1f0fb;--mu:#a3a1c4;--ln:#35335a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
.w{max-width:900px;margin:0 auto;padding:18px}.card{background:var(--card);border:2px solid var(--ln);border-radius:18px;padding:18px;margin-bottom:16px}
input,select,button{font:inherit;padding:10px 14px;border-radius:12px;border:2px solid var(--ln);background:var(--bg);color:var(--ink)}
button{cursor:pointer;font-weight:600}.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{margin:10px 0}.bl{display:flex;justify-content:space-between;font-size:14px}.tr{height:14px;background:var(--ln);border-radius:8px;overflow:hidden}.tr i{display:block;height:100%}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}th,td{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:left}
.sc{overflow-x:auto}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.st{flex:1;min-width:120px}.st b{font-size:26px;display:block}.mu{color:var(--mu)}h2{margin:0 0 10px;font-size:18px}
</style></head><body><div class="w" id="app"></div>
<script>
// ===== Halaman admin mandiri: buka /admin → LANGSUNG nampilin data kuisioner (localStorage, tanpa login) =====
// Data sila & helper (diambil dari sila.js, di-inline biar halaman nggak butuh file lain)
const SILA=[
{n:"Sila 1",t:"Ketuhanan Yang Maha Esa",c:"#f2b705",ink:"#3a2c00",arch:"Sang Penjaga Iman",mod:"yang Khusyuk",d:"Imanmu jadi kompas dalam bertindak. Kamu jujur, amanah, dan menghormati keyakinan orang lain karena percaya setiap perbuatan bernilai di hadapan Tuhan.",kuat:"Teguh pendirian, jujur, toleran",tantang:"Jangan sampai teguh berubah jadi menutup diri dari pandangan lain.",s:"Teruskan kebiasaan baikmu, dan ajak teman beda keyakinan ngobrol untuk saling belajar.",makna:"Ketuhanan menuntun kita bersikap jujur, bersyukur, dan saling menghormati keyakinan.",hi:"Kamu sudah kuat di sini: imanmu terlihat dalam kejujuran, syukur, dan sikap menghormati orang lain.",mid:"Sila ini sudah cukup tumbuh dalam dirimu, tapi masih bisa dirawat lewat kebiasaan kecil yang konsisten.",lo:"Sila ini belum jadi sorotanmu. Itu wajar, dan bisa kamu mulai dari kebiasaan sederhana seperti bersyukur dan jujur.",sr:["Sisihkan 5 menit tiap hari untuk berdoa atau merenung.","Ucapkan selamat pada teman saat hari rayanya, apa pun agamanya.","Biasakan jujur pada hal kecil, termasuk saat tak ada yang melihat."]},
{n:"Sila 2",t:"Kemanusiaan yang Adil dan Beradab",c:"#e63946",ink:"#fff",arch:"Sang Pelindung Sesama",mod:"yang Berhati Lembut",d:"Kamu peka pada perasaan orang lain dan tak tahan melihat ketidakadilan. Empati, sopan santun, dan membela yang lemah adalah ciri utamamu.",kuat:"Empatik, santun, pemberani membela",tantang:"Jangan lupa menjaga energi dan batasmu sendiri saat menolong.",s:"Salurkan empatimu lewat aksi nyata, misalnya jadi relawan atau pendamping teman sebaya.",makna:"Kemanusiaan berarti memperlakukan setiap orang dengan hormat, empati, dan adil.",hi:"Kamu sudah kuat di sini: kamu peka, santun, dan siap membela orang yang diperlakukan tidak adil.",mid:"Empatimu sudah ada, tinggal diasah agar lebih sering jadi tindakan nyata.",lo:"Area ini masih bisa kamu kembangkan, mulai dari mendengarkan tanpa menghakimi dan berkata dengan sopan.",sr:["Sapa satu orang baru atau pendiam tiap minggu.","Ikut satu kegiatan sosial, misalnya donasi atau kunjungan panti.","Sebelum mengomentari sesuatu, tanya dulu: apakah ini akan menyakiti seseorang?"]},
{n:"Sila 3",t:"Persatuan Indonesia",c:"#3a86ff",ink:"#fff",arch:"Sang Perekat Bangsa",mod:"yang Merangkul",d:"Kamu jago merangkul perbedaan dan menjaga kekompakan. Cinta tanah air dan semangat gotong royong membuatmu jadi perekat di kelompok mana pun.",kuat:"Kolaboratif, inklusif, cinta budaya",tantang:"Persatuan juga butuh kejujuran. Jangan simpan pendapat kritismu demi terlihat kompak.",s:"Pimpin kegiatan lintas kelas atau budaya, kamu cocok jadi penghubung.",makna:"Persatuan berarti merangkul perbedaan dan menjaga kebersamaan demi Indonesia.",hi:"Kamu sudah kuat di sini: kamu pandai menjaga kekompakan dan bangga pada budaya sendiri.",mid:"Rasa kebersamaanmu cukup baik, dan bisa tumbuh lebih besar lewat kerja sama lintas kelompok.",lo:"Area ini masih bisa kamu kembangkan, mulai dari mengenal teman dari latar belakang berbeda.",sr:["Kerjakan satu tugas bersama teman dari kelompok yang berbeda.","Pelajari satu kata atau tradisi dari daerah temanmu.","Ikut satu kegiatan bersama, seperti kerja bakti atau upacara, dengan sepenuh hati."]},
{n:"Sila 4",t:"Kerakyatan yang Dipimpin oleh Hikmat Kebijaksanaan dalam Permusyawaratan/Perwakilan",c:"#8b5cf6",ink:"#fff",arch:"Sang Juru Musyawarah",mod:"yang Bijak Berunding",d:"Kamu percaya keputusan terbaik lahir dari mendengar banyak pihak. Kamu tenang saat berbeda pendapat dan menghargai hasil kesepakatan bersama.",kuat:"Pendengar baik, tenang, menghargai suara orang",tantang:"Kadang perlu berani memutuskan cepat saat diskusi berlarut-larut.",s:"Ikut organisasi kelas atau OSIS, kemampuan berundingmu sangat berguna di sana.",makna:"Kerakyatan berarti keputusan bersama diambil lewat musyawarah dengan akal sehat dan kebijaksanaan.",hi:"Kamu sudah kuat di sini: kamu pendengar yang baik dan menghargai keputusan bersama.",mid:"Kamu sudah mau mendengar, tinggal melatih keberanian menyampaikan pendapat dengan baik.",lo:"Area ini masih bisa kamu kembangkan, mulai dari mendengar sebelum menanggapi.",sr:["Dalam diskusi berikutnya, dengarkan sampai selesai sebelum bicara.","Ikut rapat kelas atau organisasi dan sampaikan satu usul.","Latih menerima hasil voting dengan lapang dada."]},
{n:"Sila 5",t:"Keadilan Sosial bagi Seluruh Rakyat Indonesia",c:"#2bb673",ink:"#00331d",arch:"Sang Penegak Keadilan",mod:"yang Adil",d:"Kamu peduli pada pemerataan dan hak semua orang. Kamu tidak suka pilih kasih dan senang memastikan semua orang mendapat kesempatan yang sama.",kuat:"Adil, suka berbagi, berani menegur",tantang:"Imbangi tuntutan hak dengan kewajiban, karena keduanya berjalan beriringan.",s:"Mulai dari hal kecil: bagi tugas piket yang adil, atau bantu teman yang tertinggal.",makna:"Keadilan sosial berarti semua orang mendapat hak yang sama dan menjalankan kewajibannya.",hi:"Kamu sudah kuat di sini: kamu adil, suka berbagi, dan berani menegur ketidakadilan.",mid:"Rasa adilmu sudah baik, tinggal diperkuat lewat kebiasaan berbagi dan jujur pada hak orang lain.",lo:"Area ini masih bisa kamu kembangkan, mulai dari menjalankan kewajiban dan menghargai hak orang lain.",sr:["Selesaikan kewajibanmu, seperti piket atau tugas kelompok, tanpa diingatkan.","Bagi satu hal yang kamu punya dengan teman yang membutuhkan.","Akui kontribusi teman secara terbuka saat tugas kelompok selesai."]}];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tipe=(d,skor)=>{const o=skor.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]);const p=d[0],s=d.length>1?d[1]:o[1][1];return{p,s,kode:"S"+(p+1)+"·S"+(s+1),nama:SILA[p].arch+" "+SILA[s].mod}};
// Diagram batang vertikal (SVG, tanpa library)
function vbars(sk){
 const W=600,H=240,T=36,B=26,L=40,PAD=10,BW=66,N=5,GAP=(W-L-2*PAD-N*BW)/(N-1);
 const y=v=>H-B-(v/100)*(H-B-T);
 let s=`<svg viewBox="0 0 ${W} ${H+14}" style="width:100%;max-width:660px;display:block;margin:0 auto" role="img" aria-label="Diagram batang rata-rata skor per sila">`;
 [0,25,50,75,100].forEach(g=>{const gy=y(g);s+=`<line x1="${L}" y1="${gy}" x2="${W-PAD}" y2="${gy}" stroke="currentColor" opacity="${g?"0.12":"0.35"}"/><text x="${L-8}" y="${gy+4}" text-anchor="end" font-size="11" fill="currentColor" opacity=".6">${g}%</text>`});
 sk.forEach((v,i)=>{const x=L+PAD+i*(BW+GAP),h=Math.max(3,y(0)-y(v)),by=y(0)-h;
  s+=`<rect x="${x}" y="${by}" width="${BW}" height="${h}" rx="7" fill="${SILA[i].c}"/>`;
  s+=`<text x="${x+BW/2}" y="${by-7}" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">${v}%</text>`;
  s+=`<text x="${x+BW/2}" y="${H+2}" text-anchor="middle" font-size="12" fill="currentColor" opacity=".7">Sila ${i+1}</text>`});
 return s+`</svg>`;
}
// Diagram lingkaran donut (SVG, tanpa library)
function donut(cnt,total){
 const CX=90,CY=90,R=62,SW=30,C=2*Math.PI*R;
 let off=0,s=`<svg viewBox="0 0 180 180" style="width:190px;height:190px;flex:none" role="img" aria-label="Diagram lingkaran sila dominan"><circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="var(--ln)" stroke-width="${SW}"/>`;
 cnt.forEach((v,i)=>{ if(!v)return; const frac=v/total;
  s+=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${SILA[i].c}" stroke-width="${SW}" stroke-dasharray="${frac*C} ${C}" stroke-dashoffset="${-off*C}" transform="rotate(-90 ${CX} ${CY})"/>`;
  off+=frac;});
 s+=`<text x="${CX}" y="${CY-1}" text-anchor="middle" font-size="30" font-weight="800" fill="currentColor">${total}</text><text x="${CX}" y="${CY+17}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">responden</text></svg>`;
 return s;
}
// Legend warna untuk donut
const leg=(c,t)=>`<ul style="list-style:none;margin:0;padding:0;font-size:14px">${c.map((v,i)=>`<li style="display:flex;align-items:center;gap:8px;margin:7px 0"><span style="width:14px;height:14px;border-radius:4px;background:${SILA[i].c};display:inline-block;flex:none"></span>${SILA[i].n}${t?` — <b>${v}</b> org (${Math.round(v/t*100)}%)`:""}</li>`).join("")}</ul>`;

// ===== Dashboard =====
// Penyimpanan cloud JSON gratisan tanpa akun (textdb.dev) — data sinkron antar device.
// ID endpoint di bawah adalah "alamat data" lu — jangan disebar ke luar. Harus sama dengan yang di index.html.
const CLOUD="https://textdb.dev/api/data/ppkn-hasil-2cddc861f3f4678cf85af3c6";
const LS_KEY="hasil_ppkn";
const app=document.getElementById("app");
let rows=[],flt="",q="",open_="",cloudOK=true;
async function cloudRead(){const r=await fetch(CLOUD);if(!r.ok)throw new Error("HTTP "+r.status);const t=await r.text();return JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1))}
async function cloudWrite(o){const w=await fetch(CLOUD,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(o)});if(!w.ok)throw new Error("HTTP "+w.status)}
async function tryCloud(fn){for(let i=0;;i++){try{return await fn()}catch(e){if(i>=2)throw e;await new Promise(r=>setTimeout(r,900*(i+1)))}}}
function localAll(){try{ return JSON.parse(localStorage.getItem(LS_KEY)||"[]") }catch(e){ return [] }}
function cacheLocal(){try{ localStorage.setItem(LS_KEY,JSON.stringify(rows)) }catch(e){}}
async function loadCloud(){
 try{const j=await tryCloud(cloudRead);rows=(j.hasil||[]).filter(r=>r&&r.id&&Array.isArray(r.skor)&&Array.isArray(r.dominan)).sort((a,b)=>b.waktu-a.waktu);cacheLocal();cloudOK=true}
 catch(e){cloudOK=false;rows=localAll().sort((a,b)=>b.waktu-a.waktu)}
}
function dash(){
 const ks=[...new Set(rows.map(r=>r.kelas))].sort(),R=rows.filter(r=>(!flt||r.kelas===flt)&&r.nama.toLowerCase().includes(q.toLowerCase()));
 const KL=ks.map(k=>{const g=rows.filter(r=>r.kelas===k);return `<tr><td>${esc(k)}</td><td>${g.length}</td>${[0,1,2,3,4].map(i=>`<td>${Math.round(g.reduce((a,r)=>a+r.skor[i],0)/g.length)}</td>`).join("")}</tr>`}).join("");
 const avg=[0,1,2,3,4].map(i=>R.length?Math.round(R.reduce((a,r)=>a+r.skor[i],0)/R.length):0);
 const cnt=[0,0,0,0,0];R.forEach(r=>r.dominan.forEach(i=>cnt[i]++));const top=R.length?cnt.indexOf(Math.max(...cnt)):-1;
 const cntP=[0,0,0,0,0];R.forEach(r=>cntP[tipe(r.dominan,r.skor).p]++);
 app.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:14px"><h2 style="margin:0">Dashboard admin</h2><button id="rf2">Muat ulang</button></div>
 <div class="card row"><input id="s" placeholder="Cari nama peserta" value="${esc(q)}" aria-label="Cari nama"><select id="f" aria-label="Filter kelas"><option value="">Semua kelas</option>${ks.map(k=>`<option ${k===flt?"selected":""}>${esc(k)}</option>`).join("")}</select><button id="rf">Muat ulang</button><button class="p" id="csv">Unduh CSV</button></div>
 <div class="card row"><div class="st"><b>${R.length}</b>Responden</div><div class="st"><b>${top>=0?SILA[top].n:"-"}</b>Paling dominan</div></div>
 <p class="mu" style="margin:0 0 14px">${cloudOK?"✅ Data tersinkron di cloud — dashboard ini bisa dibuka dari device mana aja, isinya sama. Auto-refresh tiap 30 detik.":"⚠️ Gagal nyambung ke cloud — nampilin data cache perangkat ini. Cek koneksi lalu klik Muat ulang."}</p>
 <div class="card"><h2>📊 Diagram batang — rata-rata skor per sila</h2>${R.length?vbars(avg):'<p class="mu">Belum ada data untuk digrafik.</p>'}</div>
 <div class="card"><h2>🥧 Diagram lingkaran — sila dominan responden</h2><div class="row" style="justify-content:center">${R.length?donut(cntP,R.length)+`<div style="flex:1;min-width:220px">${leg(cntP,R.length)}</div>`:'<p class="mu">Belum ada data untuk digrafik.</p>'}</div></div>
 <div class="card sc"><h2>Ringkasan per kelas (rata-rata skor)</h2><table style="min-width:0"><tr><th>Kelas</th><th>Peserta</th><th>S1</th><th>S2</th><th>S3</th><th>S4</th><th>S5</th></tr>${KL||'<tr><td colspan="7" class="mu">Belum ada data.</td></tr>'}</table></div>
 <div class="card sc"><h2>Data peserta (klik baris untuk detail)</h2><table><tr><th>Nama</th><th>Kelas</th><th>Tipe</th><th>S1</th><th>S2</th><th>S3</th><th>S4</th><th>S5</th><th>Waktu</th><th></th></tr>
 ${R.map(r=>`<tr data-r="${r.id}" style="cursor:pointer"><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td>${tipe(r.dominan,r.skor).kode}</td>${r.skor.map(x=>`<td>${x}</td>`).join("")}<td>${new Date(r.waktu).toLocaleString("id-ID",{dateStyle:"short",timeStyle:"short"})}</td><td><button data-d="${r.id}" aria-label="Hapus ${esc(r.nama)}">Hapus</button></td></tr>${open_===r.id?`<tr><td colspan="10"><b>${esc(tipe(r.dominan,r.skor).nama)}</b> (${tipe(r.dominan,r.skor).kode})<br>Sila dominan: ${r.dominan.map(i=>SILA[i].n+" – "+SILA[i].t).join("; ")}<br>Urutan skor: ${r.skor.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).map(([v,i])=>SILA[i].n+" "+v+"%").join(" > ")}<br>Diisi: ${new Date(r.waktu).toLocaleString("id-ID",{dateStyle:"full",timeStyle:"short"})}</td></tr>`:""}`).join("")||'<tr><td colspan="10" class="mu">Belum ada data. Kerjakan tes dulu, lalu klik "Muat ulang".</td></tr>'}</table></div>`;
 const f=document.getElementById("f"),s=document.getElementById("s"),rf=document.getElementById("rf"),rf2=document.getElementById("rf2"),csv=document.getElementById("csv");
 f.onchange=()=>{flt=f.value;dash()};
 s.oninput=()=>{q=s.value;dash();const e=document.getElementById("s");e.focus();e.setSelectionRange(q.length,q.length)};
 app.querySelectorAll("[data-r]").forEach(t=>t.onclick=e=>{if(e.target.closest("button"))return;open_=open_===t.dataset.r?"":t.dataset.r;dash()});
 rf.onclick=rf2.onclick=async()=>{await loadCloud();dash()};
 csv.onclick=()=>{const c=["Nama,Kelas,Tipe,Nama Tipe,S1,S2,S3,S4,S5,Waktu",...R.map(r=>{const t=tipe(r.dominan,r.skor);return[r.nama,r.kelas,t.kode,t.nama,...r.skor,new Date(r.waktu).toLocaleString("id-ID")].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")})].join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+c],{type:"text/csv"}));a.download="hasil-tes-pancasila.csv";a.click()};
 app.querySelectorAll("[data-d]").forEach(x=>x.onclick=async()=>{if(!confirm("Hapus data ini?"))return;
  try{const j=await tryCloud(cloudRead);j.hasil=(j.hasil||[]).filter(r=>r.id!==x.dataset.d);await tryCloud(()=>cloudWrite(j));
   rows=j.hasil.filter(r=>r&&r.id&&Array.isArray(r.skor)&&Array.isArray(r.dominan)).sort((a,b)=>b.waktu-a.waktu);cacheLocal();cloudOK=true}
  catch(e){alert("Gagal hapus di cloud: "+e.message);return}
  dash()});
}
app.innerHTML='<div class="card" style="max-width:420px;margin:12vh auto"><p class="mu" style="margin:0">Memuat data dari cloud…</p></div>';
loadCloud().then(dash);
setInterval(()=>loadCloud().then(dash),30000);
</script></body></html>

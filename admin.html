<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Admin · Tes Pancasila</title>
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#1d1b3a;--mu:#6b6987;--ln:#e3e1f0}
@media(prefers-color-scheme:dark){:root{--bg:#14132a;--card:#1f1e3a;--ink:#f1f0fb;--mu:#a3a1c4;--ln:#35335a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
.w{max-width:900px;margin:0 auto;padding:18px}.card{background:var(--card);border:2px solid var(--ln);border-radius:18px;padding:18px;margin-bottom:16px}
input,select,button{font:inherit;padding:10px 14px;border-radius:12px;border:2px solid var(--ln);background:var(--bg);color:var(--ink)}
button{cursor:pointer;font-weight:600}.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{margin:10px 0}.bl{display:flex;justify-content:space-between;font-size:14px}.tr{height:14px;background:var(--ln);border-radius:8px;overflow:hidden}.tr i{display:block;height:100%}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}th,td{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:left}
.sc{overflow-x:auto}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.st{flex:1;min-width:120px}.st b{font-size:26px;display:block}.mu{color:var(--mu)}h2{margin:0 0 10px;font-size:18px}
</style></head><body><div class="w" id="app"></div>
<script src="sila.js"></script>
<script src="admin.js"></script>
</body></html>
